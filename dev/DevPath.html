<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevPath</title>
<style>
:root{--bg:#0b0d12;--tx:#eef0f5;--mu:#8b93a7;--gl:rgba(255,255,255,.055);--bd:rgba(255,255,255,.1);--ac:#7c9cff;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--in:rgba(255,255,255,.08);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef1f7;--tx:#14171f;--mu:#5b6478;--gl:rgba(255,255,255,.7);--bd:rgba(20,23,31,.1);--ac:#3b5bdb;--in:rgba(20,23,31,.06);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--tx);background:radial-gradient(60% 45% at 8% 0,rgba(124,156,255,.2),transparent),radial-gradient(45% 40% at 100% 100%,rgba(168,120,255,.13),transparent),var(--bg) fixed}
.app{display:flex;min-height:100vh}
aside{width:210px;padding:20px 14px;position:sticky;top:0;height:100vh;background:var(--gl);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:18px;flex:none}
.brand b{font-size:20px;letter-spacing:-.02em}.brand small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--mu);transition:.15s}
nav button:hover{background:var(--in);color:var(--tx)}nav button.on{background:var(--in);color:var(--tx);box-shadow:inset 2px 0 var(--ac)}
main{flex:1;padding:28px 32px;max-width:1180px;min-width:0}
h1{font-size:26px;letter-spacing:-.025em;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}h3{margin:0 0 12px}
.sub{color:var(--mu);margin-bottom:20px}small,.mu{color:var(--mu)}
.card{background:var(--gl);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.stat small{display:block}.stat b{font-size:24px;letter-spacing:-.02em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
.btn,select,input,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
textarea{width:100%;min-height:70px}
.btn{cursor:pointer;transition:.15s}.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);border-color:transparent;color:#fff;font-weight:600}
select option{color:#111}
label{display:block;margin-bottom:10px;color:var(--mu);font-size:12px}label>*{display:block;width:100%;margin-top:4px;color:var(--tx)}
.bar{height:6px;border-radius:9px;background:var(--in);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
.tl{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding-top:14px}
.seg{padding:10px;border-radius:12px;background:var(--in);border:1px solid transparent}.seg.cur{border-color:var(--ac)}.seg b{display:block}.seg small{display:block;margin-bottom:6px;font-size:11px}
.mk{position:absolute;top:0;width:2px;height:calc(100% - 0px);background:var(--wn);border-radius:2px}
.tr{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}.tr .g1{flex:1;min-width:0}.tr .g1 small{display:block}
.tr button,.ib{all:unset;cursor:pointer;color:var(--mu);padding:3px 7px;border-radius:7px}.tr button:hover,.ib:hover{background:var(--in);color:var(--tx)}
.tr select{padding:5px 8px;font-size:12px;width:128px}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--in);white-space:nowrap}
.High,.Hard{color:var(--er)}.Medium{color:var(--wn)}.Low,.Easy{color:var(--ok)}
summary{cursor:pointer;display:flex;gap:12px;align-items:center;list-style:none}summary::-webkit-details-marker{display:none}
.vb{display:flex;align-items:flex-end;gap:6px;height:130px}.vb div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.vb i{width:100%;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:2px;opacity:.85;transition:.3s}.vb div:hover i{opacity:1}.vb span{font-size:10px;color:var(--mu);white-space:nowrap}
.hb{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;margin:7px 0}.hb small:last-child{text-align:right}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.heat i{aspect-ratio:1;border-radius:4px;background:var(--in)}.heat i.h{background:var(--ac)}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);z-index:20;padding:16px}#modal.open{display:grid}
#modal .card{width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--bg)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:30}#toast.on{opacity:1}
.empty{text-align:center;color:var(--mu);padding:24px}
a{color:var(--ac)}
@media(max-width:800px){aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;border-right:0;border-top:1px solid var(--bd)}aside .brand{display:none}nav{flex-direction:row;width:100%}nav button{flex:1;text-align:center;font-size:10px;padding:8px 2px}nav button.on{box-shadow:none}main{padding:18px 14px 90px}.tl{grid-template-columns:repeat(3,1fr)}.tr{flex-wrap:wrap}.hb{grid-template-columns:80px 1fr 40px}}
</style></head>
<body>
<div class="app"><aside><div class="brand"><b>DevPath</b><small>Track Your Learning. Build Your Future.</small></div><nav id="nav"></nav></aside><main id="main"></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='devpath.v1',uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Dhaka'});
const dd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5),pct=(a,b)=>b?Math.round(a/b*100):0,hrs=m=>(m/60).toFixed(1);
const wk=n=>{const d=new Date(today()+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-n);return d.toISOString().slice(0,10)};
const mon=d=>new Date(d+'T00:00:00Z').toLocaleString('en',{month:'short',timeZone:'UTC'});
const ST=['Not Started','In Progress','Completed','On Hold'],PRI=['Low','Medium','High'];
const SUBJ=['Java','DSA','Spring Boot','Database','Docker','AWS','Linux','English','Projects','CS Fundamentals'];
const TOP=['Arrays','Strings','HashMap','Two Pointers','Binary Search','Linked Lists','Stack & Queue','Recursion','Trees','Graphs','DP','Other'];
const AST=['Interested','Applied','Assessment','Interview','Rejected','Offer'];
const CHK={'CV':['One-page layout','Projects with impact','Skills section','Education','Proofread','Export as PDF'],'LinkedIn':['Professional photo','Headline','About section','Projects listed','Skills & endorsements','Connections growing'],'GitHub':['Profile README','Pinned repos','Professional READMEs','Clean commit history','Architecture diagrams','Live demo links']};
const PH=[
['Java Fundamentals & DSA','2026-11-01','2026-12-31','Java:Variables and Data Types,Control Flow,Methods,Arrays and Strings,OOP Principles,Inheritance and Polymorphism,Abstraction and Encapsulation,Collections Framework,Generics,Lambda Expressions,Stream API,Exception Handling,Multithreading Basics,JDBC,JVM Fundamentals;DSA:Arrays,Strings,HashMap,Two Pointers,Binary Search,Linked Lists,Stack and Queue,Recursion,Basic Trees,Solve 70–90 problems'],
['Spring Boot & Backend','2027-01-01','2027-02-28',':Spring Framework,Dependency Injection,Inversion of Control,Spring Boot Architecture,REST API,Controller-Service-Repository Architecture,DTO and Entity,Spring Data JPA,Hibernate,PostgreSQL Integration,Spring Security,JWT Authentication,Role-Based Authorization,Validation,Global Exception Handling,Pagination and Filtering,Swagger/OpenAPI,Build Student Management REST API'],
['Real-World Projects','2027-03-01','2027-04-30','Cholo Riksha:Authentication,Ride Management,Ride Matching,PostgreSQL + PostGIS,Database Transactions,API Documentation,Testing,Security Improvements;Job Portal:User Authentication,Candidate Profiles,Employer Profiles,Job Management,Job Applications,Search and Filtering,Admin Management;Database:Normalization,Indexing,ACID Properties,SQL Joins,N+1 Query Problem,Lazy vs Eager Loading'],
['Docker, Linux & Cloud','2027-05-01','2027-06-30','Docker:Images,Containers,Dockerfile,Docker Compose,Volumes,Networks;Linux:File System,Permissions,Process Management,SSH,Shell Commands,Logs;AWS:EC2,S3,RDS,IAM,VPC,CloudWatch;Testing:JUnit 5,Mockito,Unit Testing,Integration Testing;:Milestone — deploy one backend application online'],
['Portfolio & Internship','2027-07-01','2027-08-31',':GitHub Portfolio,Project Documentation,Professional README,Clean Commit History,Architecture Diagrams,Professional CV,LinkedIn Optimization,Internship Search,Internship Applications,Technical Interview Practice'],
['International Job Prep','2027-09-01','2027-10-31','DSA Revision:Arrays and Strings,Hashing,Binary Search,Linked Lists,Stack and Queue,Trees,Graphs,Dynamic Programming Basics;System Design:Client-Server Architecture,Load Balancing,Caching,Database Replication,Database Sharding,Monolithic vs Microservices,Message Queues,Rate Limiting;Career:English Communication,Behavioral Interview Preparation,Technical Interviews,Professional CV,LinkedIn,International Job Applications,Remote Job Search']];
function seed(){const t=[];PH.forEach((p,i)=>p[3].split(';').forEach(g=>{const j=g.indexOf(':'),a=g.slice(0,j);g.slice(j+1).split(',').forEach(x=>t.push({id:uid(),ph:i,title:a?a+': '+x:x,st:ST[0],pri:'Medium',due:p[2],notes:''}))}));return t}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.tasks)S={tasks:seed(),sess:[],dsa:[],apps:[],chk:{},set:{target:210,grad:'2027-10-31',theme:'dark'},proj:[
{id:uid(),pre:'Cholo Riksha',name:'Cholo Riksha',desc:'Ride-hailing backend with ride matching and geospatial queries.',stack:'Spring Boot, PostgreSQL, PostGIS',start:'2027-03-01',deadline:'2027-04-30',status:ST[0],repo:'',live:'',features:'Authentication\nRide management\nRide matching\nTransactions\nAPI docs\nTesting',prog:0},
{id:uid(),pre:'Job Portal',name:'Job Portal Backend',desc:'Backend for candidates, employers and job applications.',stack:'Spring Boot, PostgreSQL',start:'2027-03-15',deadline:'2027-04-30',status:ST[0],repo:'',live:'',features:'User auth\nCandidate & employer profiles\nJob management\nApplications\nSearch & filtering\nAdmin',prog:0}]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save to this browser')}};
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2200)}
const done=t=>t.st==ST[2],cur=()=>{let c=0;PH.forEach((p,i)=>{if(p[1]<=today())c=i});return c};
const ph=i=>{const L=S.tasks.filter(x=>x.ph==i);return pct(L.filter(done).length,L.length)};
const sum=f=>S.sess.filter(f).reduce((a,s)=>a+ +s.min,0),mins=d=>sum(s=>s.date==d);
function streak(){let d=new Date(today()+'T00:00:00Z'),n=0;const f=x=>x.toISOString().slice(0,10);if(!mins(f(d)))d.setUTCDate(d.getUTCDate()-1);while(mins(f(d))){n++;d.setUTCDate(d.getUTCDate()-1)}return n}
function longest(){const ds=[...new Set(S.sess.map(s=>s.date))].sort();let b=0,n=0,p=null;ds.forEach(d=>{n=p&&dd(p,d)==1?n+1:1;b=Math.max(b,n);p=d});return b}
const projPct=p=>{if(!p.pre)return +p.prog||0;const L=S.tasks.filter(x=>x.title.startsWith(p.pre+':'));return pct(L.filter(done).length,L.length)};
const ring=(p,z=84)=>`<svg width="${z}" height="${z}" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--in)" stroke-width="3"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="${Math.min(p,100)} 100" transform="rotate(-90 18 18)"/><text x="18" y="20.5" text-anchor="middle" font-size="8" font-weight="600" fill="currentColor">${p}%</text></svg>`;
const vb=d=>{const m=Math.max(...d.map(x=>x[1]),0);return `<div class="vb">${d.map(([l,v,t])=>`<div title="${esc(t)}"><i style="height:${m?v/m*100:0}%"></i><span>${l}</span></div>`).join('')}</div>`};
const hb=(d,u='')=>{const m=Math.max(...d.map(x=>x[1]),0);return d.map(([l,v])=>`<div class="hb"><small>${esc(l)}</small><div class="bar"><i style="width:${m?v/m*100:0}%"></i></div><small>${v}${u}</small></div>`).join('')||'<div class="empty">No data yet</div>'};
const link=u=>/^https?:/.test(u||'')?`<a href="${esc(u)}" target="_blank" rel="noopener">open ↗</a>`:'';
const stat=(l,v,s='')=>`<div class="stat"><small>${l}</small><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
const lastN=n=>[...Array(n)].map((_,i)=>wk(n-1-i));

function home(){
 const t=today(),c=cur(),T=S.tasks,dn=T.filter(done).length,tm=mins(t),tg=S.set.target,p=PH[c];
 const up=T.filter(x=>x.ph==c&&!done(x)&&x.st!=ST[3]).sort((a,b)=>(b.st==ST[1])-(a.st==ST[1])).slice(0,5);
 const dl=[...T.filter(x=>!done(x)).map(x=>[x.due,x.title,'Task']),...S.proj.filter(x=>x.deadline&&x.status!=ST[2]).map(x=>[x.deadline,x.name,'Project']),...S.apps.filter(x=>x.interview>=t).map(x=>[x.interview,x.company+' interview','Interview'])].filter(x=>x[0]).sort().slice(0,5);
 const pos=Math.max(0,Math.min(100,dd('2026-11-01',t)/dd('2026-11-01','2027-10-31')*100));
 return `<h1>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Dhaka'})}</h1><div class="sub">Phase ${c+1}: ${p[0]}</div>
 <div class="grid">${stat('Roadmap',pct(dn,T.length)+'%')}${stat('Phase',c+1+' / 6',esc(p[0]))}${stat('Days to graduation',Math.max(0,dd(t,S.set.grad)))}${stat('Study hours',hrs(sum(()=>1)))}${stat('Completed',dn)}${stat('Pending',T.length-dn)}${stat('Streak',streak()+' d')}</div>
 <div class="grid g2"><div class="card"><h2>Study today</h2><div class="row">${ring(pct(tm,tg))}<div class="sp"><b>${hrs(tm)}h</b> of ${hrs(tg)}h target<br><small>${tm>=tg?'Target hit. Nice.':'Keep going, '+hrs(Math.max(0,tg-tm))+'h left.'}</small></div><button class="btn pri" data-a="go" data-i="study">Log session</button></div>
 <h2>Up next</h2>${up.map(x=>`<div class="tr"><div class="g1"><b>${esc(x.title)}</b><small>${x.st}</small></div><button data-a="finish" data-i="${x.id}" title="Mark completed">✓ Done</button></div>`).join('')||'<div class="empty">Nothing pending in this phase.</div>'}</div>
 <div class="card"><h2>This week</h2>${vb(lastN(7).map(d=>[d.slice(8),mins(d),d+': '+hrs(mins(d))+'h']))}<h2 style="margin-top:16px">Upcoming deadlines</h2>${dl.map(x=>`<div class="tr"><div class="g1">${esc(x[1])}</div><span class="pill">${x[2]}</span><small>${x[0]}</small></div>`).join('')||'<div class="empty">No deadlines.</div>'}</div></div>
 <div class="card"><h2>12-month roadmap</h2><div class="tl"><div class="mk" style="left:${pos}%"></div>${PH.map((q,i)=>`<div class="seg ${i==c?'cur':''}"><b>Phase ${i+1}</b><small>${mon(q[1])}–${mon(q[2])}</small><div class="bar"><i style="width:${ph(i)}%"></i></div></div>`).join('')}</div></div>`}

let Q='',F='All',V='home';
function roadmap(){const q=Q.toLowerCase();
 return `<h1>Roadmap</h1><div class="sub">Edit tasks, statuses, priorities and deadlines.</div><div class="row"><input id="q" placeholder="Search tasks…" value="${esc(Q)}" data-c="q"><select data-c="flt">${['All',...ST].map(x=>`<option ${F==x?'selected':''}>${x}</option>`).join('')}</select><span class="sp"></span><button class="btn pri" data-a="ed" data-k="tasks" data-i="">+ Task</button></div>`+PH.map((p,i)=>{
 const L=S.tasks.filter(x=>x.ph==i),v=L.filter(x=>(F=='All'||x.st==F)&&x.title.toLowerCase().includes(q));
 return `<details class="card" ${i==cur()||q||F!='All'?'open':''}><summary><div class="sp"><h2 style="margin:0">Phase ${i+1}: ${p[0]}</h2><small>${mon(p[1])} ${p[1].slice(0,4)} – ${mon(p[2])} ${p[2].slice(0,4)} · ${L.filter(done).length}/${L.length} done</small></div><b>${ph(i)}%</b></summary><div class="bar" style="margin:10px 0"><i style="width:${ph(i)}%"></i></div>`+
 (v.map(x=>`<div class="tr"><select data-c="st" data-i="${x.id}">${ST.map(s=>`<option ${x.st==s?'selected':''}>${s}</option>`).join('')}</select><div class="g1"><b ${done(x)?'style="opacity:.55;text-decoration:line-through"':''}>${esc(x.title)}</b>${x.notes?`<small>${esc(x.notes)}</small>`:''}</div><span class="pill ${x.pri}">${x.pri}</span><small>${x.due}</small><button data-a="mv" data-i="${x.id}" data-d="-1">↑</button><button data-a="mv" data-i="${x.id}" data-d="1">↓</button><button data-a="ed" data-k="tasks" data-i="${x.id}">Edit</button><button data-a="del" data-k="tasks" data-i="${x.id}">✕</button></div>`).join('')||'<div class="empty">No tasks match.</div>')+`</details>`}).join('')}

function study(){const t=today(),m=t.slice(0,7),open=S.tasks.filter(x=>!done(x));
 return `<h1>Study tracker</h1><div class="sub">Daily target ${hrs(S.set.target)}h (change it in Settings).</div>
 <div class="grid">${stat('Today',hrs(mins(t))+'h')}${stat('This week',hrs(sum(s=>s.date>wk(7)))+'h')}${stat('This month',hrs(sum(s=>s.date.startsWith(m)))+'h')}${stat('Streak',streak()+' d')}</div>
 <form class="card" id="lg"><h2>Log a session</h2><div class="grid"><label>Date<input type="date" name="date" value="${t}" required></label><label>Subject<select name="subject">${SUBJ.map(s=>`<option>${s}</option>`).join('')}</select></label><label>Minutes<input type="number" name="min" min="1" max="1440" value="60" required></label><label>Topic finished (optional)<select name="task"><option value="">—</option>${open.slice(0,80).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label></div><label>What did you learn?<textarea name="notes"></textarea></label><button class="btn pri">Save session</button></form>
 <div class="card"><h2>History</h2>${[...S.sess].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(s=>`<div class="tr"><small>${s.date}</small><span class="pill">${s.subject}</span><b>${s.min}m</b><div class="g1"><small>${esc(s.notes)}</small></div><button data-a="del" data-k="sess" data-i="${s.id}">✕</button></div>`).join('')||'<div class="empty">No sessions yet. Log your first one above.</div>'}</div>`}

function dsa(){const D=S.dsa,sv=D.filter(x=>x.status=='Solved'),by=d=>sv.filter(x=>x.diff==d).length;
 return `<h1>DSA tracker</h1><div class="sub">Target: 70–90 problems in Phase 1.</div><div class="row"><span class="sp"></span><button class="btn pri" data-a="ed" data-k="dsa" data-i="">+ Problem</button></div>
 <div class="grid">${stat('Solved',sv.length,'of 90 target')}${stat('Easy',by('Easy'))}${stat('Medium',by('Medium'))}${stat('Hard',by('Hard'))}</div>
 <div class="grid g2"><div class="card"><h2>By topic</h2>${hb(TOP.map(t=>[t,sv.filter(x=>x.topic==t).length]).filter(x=>x[1]))}</div><div class="card"><h2>Last 7 days</h2>${vb(lastN(7).map(d=>[d.slice(8),sv.filter(x=>x.date==d).length,d+': '+sv.filter(x=>x.date==d).length+' solved']))}</div></div>
 <div class="card"><h2>Problems</h2>${[...D].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="tr"><div class="g1"><b>${esc(x.name)}</b><small>${x.platform} · ${x.topic} · ${x.date} · ${x.min}m ${link(x.url)}</small>${x.notes?`<small>${esc(x.notes)}</small>`:''}</div><span class="pill ${x.diff}">${x.diff}</span><span class="pill">${x.status}</span><button data-a="ed" data-k="dsa" data-i="${x.id}">Edit</button><button data-a="del" data-k="dsa" data-i="${x.id}">✕</button></div>`).join('')||'<div class="empty">No problems logged yet.</div>'}</div>`}

function projects(){return `<h1>Projects</h1><div class="sub">Progress for the two preloaded projects follows their Phase 3 tasks.</div><div class="row"><span class="sp"></span><button class="btn pri" data-a="ed" data-k="proj" data-i="">+ Project</button></div><div class="grid g2">`+S.proj.map(p=>`<div class="card"><div class="row"><div class="sp"><h2 style="margin:0">${esc(p.name)}</h2><small>${esc(p.stack)}</small></div>${ring(projPct(p),64)}</div><p>${esc(p.desc)}</p><small>${p.status} · ${p.start||'?'} → ${p.deadline||'?'} ${link(p.repo)} ${link(p.live)}</small><ul>${(p.features||'').split('\n').filter(Boolean).map(f=>`<li>${esc(f)}</li>`).join('')}</ul><div class="row"><button class="btn" data-a="ed" data-k="proj" data-i="${p.id}">Edit</button><button class="btn" data-a="del" data-k="proj" data-i="${p.id}">Delete</button></div></div>`).join('')+'</div>'}

function career(){const A=S.apps;
 return `<h1>Career prep</h1><div class="sub">Checklists and application tracking.</div><div class="grid g2">${Object.entries(CHK).map(([g,L])=>`<div class="card"><h2>${g} checklist · ${pct(L.filter(i=>S.chk[g+i]).length,L.length)}%</h2>${L.map(i=>`<label style="color:var(--tx);display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" style="width:auto;margin:0" data-c="chk" data-i="${g+i}" ${S.chk[g+i]?'checked':''}>${i}</label>`).join('')}</div>`).join('')}</div>
 <div class="card"><div class="row"><h2 class="sp" style="margin:0">Applications</h2><button class="btn pri" data-a="ed" data-k="apps" data-i="">+ Application</button></div><div class="row">${AST.map(s=>`<span class="pill">${s}: ${A.filter(a=>a.status==s).length}</span>`).join('')}</div>${A.map(a=>`<div class="tr"><div class="g1"><b>${esc(a.company)}</b> · ${esc(a.pos)}<small>${a.type} · applied ${a.date||'—'}${a.interview?' · interview '+a.interview:''}${a.notes?' · '+esc(a.notes):''}</small></div><select data-c="ast" data-i="${a.id}">${AST.map(s=>`<option ${a.status==s?'selected':''}>${s}</option>`).join('')}</select><button data-a="ed" data-k="apps" data-i="${a.id}">Edit</button><button data-a="del" data-k="apps" data-i="${a.id}">✕</button></div>`).join('')||'<div class="empty">No applications yet.</div>'}</div>`}

function stats(){const T=S.tasks,dn=T.filter(done).length,sv=S.dsa.filter(x=>x.status=='Solved'),t=today();
 const mo=[...Array(12)].map((_,i)=>{const y=2026+Math.floor((10+i)/12),m=(10+i)%12+1;return y+'-'+String(m).padStart(2,'0')});
 const days=lastN(28);
 return `<h1>Analytics</h1><div class="sub">Hover any bar for exact values.</div><div class="grid g2"><div class="card"><h2>Overall progress</h2><div class="row">${ring(pct(dn,T.length),96)}<div>${dn} completed<br>${T.length-dn} pending</div></div></div><div class="card"><h2>Phase completion</h2>${hb(PH.map((p,i)=>['Phase '+(i+1),ph(i)]),'%')}</div>
 <div class="card"><h2>Weekly study hours</h2>${vb([...Array(8)].map((_,i)=>{const n=7-i,h=hrs(sum(s=>s.date>wk(7*n+7)&&s.date<=wk(7*n)));return [n?'-'+n+'w':'now',+h,'Week '+(n?'-'+n:'current')+': '+h+'h']}))}</div>
 <div class="card"><h2>Monthly trend</h2>${vb(mo.map(m=>{const h=hrs(sum(s=>s.date.startsWith(m)));return [mon(m+'-01'),+h,m+': '+h+'h']}))}</div>
 <div class="card"><h2>Time by subject (h)</h2>${hb(SUBJ.map(s=>[s,+hrs(sum(x=>x.subject==s))]).filter(x=>x[1]))}</div>
 <div class="card"><h2>DSA by difficulty</h2>${hb(['Easy','Medium','Hard'].map(d=>[d,sv.filter(x=>x.diff==d).length]))}</div>
 <div class="card"><h2>Streaks</h2><p>Current <b>${streak()}</b> · longest <b>${longest()}</b> days</p><div class="heat">${days.map(d=>`<i class="${mins(d)?'h':''}" title="${d}: ${hrs(mins(d))}h"></i>`).join('')}</div><small>Last 28 days</small></div></div>`}

function settings(){return `<h1>Settings</h1><div class="sub">Everything is stored in this browser. Back it up regularly.</div><div class="card"><div class="grid"><label>Daily target (hours)<input type="number" step="0.5" min="0.5" data-c="set" data-k="target" value="${S.set.target/60}"></label><label>Graduation date<input type="date" data-c="set" data-k="grad" value="${S.set.grad}"></label></div><div class="row"><button class="btn" data-a="theme">Switch to ${S.set.theme=='light'?'dark':'light'} mode</button></div></div>
 <div class="card"><h2>Backup</h2><small>Export puts your data in the box so you can copy and save it. To restore, paste a backup into the box and press Import.</small><textarea id="bk" style="min-height:140px;margin:10px 0"></textarea><div class="row"><button class="btn" data-a="exp">Export</button><button class="btn" data-a="imp">Import</button><button class="btn" data-a="reset">Reset everything</button></div></div>`}

const FD={
tasks:()=>[[['title','Title','text'],['ph','Phase','select',PH.map(p=>p[0])],['st','Status','select',ST],['pri','Priority','select',PRI],['due','Due date','date'],['notes','Notes','area']],{title:'',ph:PH[cur()][0],st:ST[0],pri:'Medium',due:PH[cur()][2],notes:''},{to:o=>({...o,ph:typeof o.ph=='number'?PH[o.ph][0]:o.ph}),from:d=>{d.ph=PH.findIndex(p=>p[0]==d.ph)}}],
dsa:()=>[[['name','Problem name','text'],['platform','Platform','select',['LeetCode','HackerRank','Codeforces','Other']],['topic','Topic','select',TOP],['diff','Difficulty','select',['Easy','Medium','Hard']],['url','Problem URL','url'],['date','Solved date','date'],['min','Time taken (min)','number'],['status','Solution status','select',['Solved','Attempted','Revisit']],['notes','Notes','area']],{name:'',platform:'LeetCode',topic:'Arrays',diff:'Easy',url:'',date:today(),min:20,status:'Solved',notes:''}],
proj:()=>[[['name','Name','text'],['desc','Description','area'],['stack','Technology stack','text'],['start','Start date','date'],['deadline','Deadline','date'],['status','Status','select',ST],['repo','GitHub repository','url'],['live','Live URL','url'],['features','Features (one per line)','area'],['prog','Progress % (custom projects)','number']],{name:'',desc:'',stack:'',start:today(),deadline:'',status:ST[0],repo:'',live:'',features:'',prog:0}],
apps:()=>[[['company','Company','text'],['pos','Position','text'],['type','Type','select',['Internship','International job']],['status','Status','select',AST],['date','Application date','date'],['interview','Interview date','date'],['notes','Notes','area']],{company:'',pos:'',type:'Internship',status:'Interested',date:'',interview:'',notes:''}]};
function form(title,fields,v,ok){const m=$('#modal');m.className='open';
 m.innerHTML=`<form class="card"><h3>${title}</h3>${fields.map(([k,l,t,o],i)=>`<label>${l}${t=='select'?`<select name="${k}">${o.map(x=>`<option ${v[k]==x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:t=='area'?`<textarea name="${k}">${esc(v[k])}</textarea>`:`<input name="${k}" type="${t}" value="${esc(v[k])}" ${i?'':'required'} ${t=='number'?'min="0"':''}>`}</label>`).join('')}<div class="row"><span class="sp"></span><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri">Save</button></div></form>`;
 m.querySelector('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));fields.forEach(([k,,t])=>{if(t=='number')d[k]=+d[k]});ok(d);save();A.close();render()}}
const A={
go:i=>{V=i;render();scrollTo(0,0)},close:()=>{$('#modal').className='';$('#modal').innerHTML=''},
theme:()=>{S.set.theme=S.set.theme=='light'?'dark':'light';save();render()},
finish:i=>{S.tasks.find(x=>x.id==i).st=ST[2];save();render()},
mv:(i,b)=>{const a=S.tasks,x=a.findIndex(t=>t.id==i),d=+b.dataset.d;let y=x+d;while(a[y]&&a[y].ph!=a[x].ph)y+=d;if(a[y]){[a[x],a[y]]=[a[y],a[x]];save();render()}},
del:(i,b)=>{if(confirm('Delete this item? This can’t be undone.')){S[b.dataset.k]=S[b.dataset.k].filter(x=>x.id!=i);save();render()}},
ed:(i,b)=>{const k=b.dataset.k,[f,def,ad={}]=FD[k](),o=S[k].find(x=>x.id==i);form(o?'Edit':'Add',f,ad.to?ad.to(o||def):(o||def),d=>{if(ad.from)ad.from(d);o?Object.assign(o,d):S[k].push({id:uid(),...d})})},
exp:()=>{$('#bk').value=JSON.stringify(S,null,1);$('#bk').select();toast('Copy this text and keep it safe')},
imp:()=>{try{const d=JSON.parse($('#bk').value);if(!d.tasks||!d.set)throw 0;if(confirm('Replace all current data with this backup?')){S=d;save();render();toast('Backup restored')}}catch(e){toast('That isn’t a valid DevPath backup')}},
reset:()=>{if(confirm('Erase all DevPath data and restore the default roadmap?')){localStorage.removeItem(K);location.reload()}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i,b)});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c,i=t.dataset.i;if(!c)return;
 if(c=='st')S.tasks.find(x=>x.id==i).st=t.value;else if(c=='ast')S.apps.find(x=>x.id==i).status=t.value;else if(c=='chk')S.chk[i]=t.checked;
 else if(c=='flt'){F=t.value;render();return}else if(c=='set'){const v=t.value;if(!v)return;S.set[t.dataset.k]=t.dataset.k=='target'?Math.round(+v*60):v}
 save();render()});
document.addEventListener('input',e=>{if(e.target.dataset.c=='q'){Q=e.target.value;render();const q=$('#q');q.focus();q.setSelectionRange(99,99)}});
document.addEventListener('submit',e=>{if(e.target.id!='lg')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
 S.sess.push({id:uid(),date:d.date,subject:d.subject,min:+d.min,notes:d.notes});
 const t=S.tasks.find(x=>x.id==d.task);if(t)t.st=ST[2];save();render();toast('Session saved')});
const NAV=[['home','Home'],['roadmap','Roadmap'],['study','Study'],['dsa','DSA'],['projects','Projects'],['career','Career'],['stats','Stats'],['settings','Settings']],R={home,roadmap,study,dsa,projects,career,stats,settings};
function render(){document.documentElement.dataset.theme=S.set.theme||'dark';$('#nav').innerHTML=NAV.map(([k,l])=>`<button class="${V==k?'on':''}" data-a="go" data-i="${k}">${l}</button>`).join('');$('#main').innerHTML=R[V]()}
render();
</script>

<script>
(()=>{
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',road:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',study:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/>',dsa:'<path d="m8 8-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',projects:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',career:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',stats:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',chev:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m5 12 5 5 9-10"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 2 1 2 0-3 0-5 2-8z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ico=(n,z=18)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const NV=[['home','Overview','home'],['roadmap','My Roadmap','road'],['focus','Focus','focus'],['study','Study Tracker','study'],['dsa','DSA Practice','dsa'],['projects','Projects','projects'],['career','Career Center','career'],['stats','Analytics','stats'],['settings','Settings','settings']];
const mig=()=>{S.pst=S.pst||{};S.pn=S.pn||{};S.set.ac=S.set.ac||'#4f7cff'};mig();
const subj=x=>{const i=x.title.indexOf(': ');return i>0?x.title.slice(0,i):PH[x.ph][0]};
const fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const nt=()=>A.ed('',{dataset:{k:'tasks'}});
const deadlines=()=>{const t=today();return [...S.tasks.filter(x=>!done(x)&&x.due).map(x=>[x.due,x.title,'Task']),...S.proj.filter(x=>x.deadline&&x.status!=ST[2]).map(x=>[x.deadline,x.name,'Project']),...S.apps.filter(x=>x.interview>=t).map(x=>[x.interview,x.company+' interview','Interview'])].sort()};
const pst=i=>{const m=S.pst[i];if(m)return m;const p=ph(i),c=cur();return p==100?'Completed':i<=c?'Active':i==c+1?'Upcoming':'Locked'};
const W=(t,l,b,c='')=>`<div class="card ${c}"><div class="row"><h2 class="sp" style="margin:0">${t}</h2>${l}</div>${b}</div>`;
const lk=(v,t)=>`<button class="lnk" data-a="go" data-i="${v}">${t} →</button>`;
const ring=(p,z,w=3)=>`<svg width="${z}" height="${z}" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--in)" stroke-width="${w}"/><circle class="rg" cx="18" cy="18" r="15.9" fill="none" stroke="var(--ac)" stroke-width="${w}" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" data-p="${Math.min(p,100)}" transform="rotate(-90 18 18)"/></svg>`;
const hm=f=>`<div class="hm">${[...Array(91)].map((_,i)=>{const d=wk(90-i),v=f(d);return `<i class="${v?'l'+Math.min(3,v):''}" title="${d}: ${v}"></i>`}).join('')}</div>`;
const CS=Object.entries(CHK).flatMap(([g,L])=>L.map(i=>g+i));
function feed(){const a=[];S.sess.forEach(s=>a.push([s.date,`Studied ${s.subject} for ${s.min}m`]));S.dsa.forEach(d=>a.push([d.date,`${d.status} “${d.name}” (${d.diff})`]));S.apps.forEach(x=>x.date&&a.push([x.date,`Application: ${x.company}`]));S.tasks.forEach(x=>x.doneAt&&a.push([x.doneAt,`Completed ${x.title}`]));S.proj.forEach(p=>p.status==ST[2]&&a.push([p.deadline||p.start,`Project completed: ${p.name}`]));return a.sort((x,y)=>y[0].localeCompare(x[0])).slice(0,6)}

R.home=()=>{const t=today(),c=cur(),T0=S.tasks,dn=T0.filter(done).length,P=pct(dn,T0.length),tm=mins(t),w7=sum(s=>s.date>wk(7)),w14=sum(s=>s.date>wk(14)&&s.date<=wk(7)),dl=deadlines().slice(0,5),sv=S.dsa.filter(x=>x.status=='Solved'),cr=pct(CS.filter(k=>S.chk[k]).length,CS.length),ds=new Set(S.sess.filter(s=>s.date>wk(7)).map(s=>s.date)).size;
 const foc=T0.filter(x=>x.ph==c&&!done(x)&&x.st!=ST[3]).sort((a,b)=>(b.st==ST[1])-(a.st==ST[1])||PRI.indexOf(b.pri)-PRI.indexOf(a.pri)).slice(0,5),act=feed(),ap=S.proj.filter(p=>p.status!=ST[2]).slice(0,3);
 const tile=(i,l,v,a)=>`<div class="stat tile ${a||''}"><div class="ic">${ico(i)}</div><b>${v}</b><small>${l}</small></div>`;
 return `<div class="hd"><div><h1>Welcome back, Pranto.</h1><div class="sub">Your next step towards becoming an international software engineer.</div><div class="chips"><span class="chip">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Dhaka'})}</span><span class="chip">Phase <b>${c+1}</b> · ${PH[c][0]}</span><span class="chip"><b>${Math.max(0,dd(t,S.set.grad))}</b> days to graduation</span></div></div><button class="wbtn" data-a="qt">${ico('plus',16)}<span>Quick add task</span></button></div>
 <div class="bento"><div class="card c4" style="text-align:center"><div class="mu">Roadmap completion</div><div style="margin:10px auto;position:relative;width:170px">${ring(P,170,2.6)}<div class="tt" style="font-size:36px">${P}%</div></div><div class="mu">${dn} of ${T0.length} tasks completed</div></div>
 <div class="col2 c8"><div class="grid">${tile('check','Tasks completed',dn,'ac')}${tile('road','Total tasks',T0.length)}${tile('clock','Study hours',hrs(sum(()=>1))+'h')}${tile('flame','Day streak',streak())}</div>
 ${W('Weekly study hours',lk('stats','Analytics'),`<div class="row" style="margin:8px 0"><div class="big">${hrs(w7)}<small> h this week</small></div><span class="chip">${w14?(w7>=w14?'+':'')+Math.round((w7-w14)/w14*100)+'% vs last week':'Today '+hrs(tm)+'h of '+hrs(S.set.target)+'h'}</span></div><div class="wk">${vb(lastN(7).map(d=>[new Date(d+'T00:00:00Z').toLocaleDateString('en',{weekday:'short',timeZone:'UTC'}),+hrs(mins(d)),d+': '+hrs(mins(d))+'h']))}</div>`)}</div></div>
 <div class="bento">${W('Today’s focus',`<button class="lnk" data-a="go" data-i="roadmap">Open tasks →</button>`,foc.map(x=>`<div class="tk"><input type="checkbox" class="ck" data-a="tog" data-i="${x.id}"><div class="g1"><b>${esc(x.title)}</b><small>${esc(subj(x))}${x.est?' · '+x.est+'m':''}</small></div><span class="pill ${x.pri}">${x.pri}</span><button class="btn" data-a="tsk" data-i="${x.id}">Start</button><button class="lnk" data-a="ed" data-k="tasks" data-i="${x.id}">Edit</button></div>`).join('')||'<div class="empty">Nothing pending in this phase.</div>','c8')}
 <div class="card grad c4"><small>Current phase</small><h2 style="font-size:22px;margin:4px 0 14px">${PH[c][0]}</h2><div class="big">${ph(c)}%</div><div class="bar" style="margin:14px 0"><i style="width:${ph(c)}%"></i></div><small>${mon(PH[c][1])} – ${mon(PH[c][2])} ${PH[c][2].slice(0,4)}</small><div class="row" style="margin:14px 0 0"><button class="btn" data-a="rp" data-i="${c}">View details</button><button class="btn" data-a="tpom">Start focus</button></div></div></div>
 <div class="bento">${W('Upcoming deadlines','',dl.map(x=>`<div class="tr"><div class="g1">${esc(x[1])}</div><span class="pill">${x[2]}</span><small>${x[0]}</small></div>`).join('')||'<div class="empty">No deadlines.</div>','c4')}
 ${W('DSA practice',lk('dsa','Open'),`<div class="big" style="margin:8px 0 12px">${sv.length}<small> solved</small></div>${hm(d=>sv.filter(x=>x.date==d).length)}`,'c4')}
 ${W('Active projects',lk('projects','Open'),ap.map(p=>`<div style="margin:12px 0"><div class="row" style="margin:0 0 6px"><b class="sp">${esc(p.name)}</b><small>${projPct(p)}%</small></div><div class="bar"><i style="width:${projPct(p)}%"></i></div></div>`).join('')||'<div class="empty">No active projects.</div>','c4')}</div>
 <div class="bento">${W('Career readiness',lk('career','Open'),`<div class="big" style="margin:8px 0 12px">${cr}%</div><div class="bar"><i style="width:${cr}%"></i></div><p class="mu">${S.apps.length} applications tracked · studied ${ds} of the last 7 days</p>`,'c4')}
 ${W('Activity timeline','',act.map(a=>`<div class="act"><i></i><div><div>${esc(a[1])}</div><small>${a[0]}</small></div></div>`).join('')||'<div class="empty">Activity will appear here as you study, solve problems and complete tasks.</div>','c8')}</div>`};

R.roadmap=()=>{const i=RP??cur(),p=PH[i],q=Q.toLowerCase(),L=S.tasks.filter(x=>x.ph==i),v=L.filter(x=>x.title.toLowerCase().includes(q)),st=pst(i),G={};L.forEach(x=>{const k=subj(x);(G[k]=G[k]||[]).push(x)});
 return `<h1>My Roadmap</h1><div class="sub">Six phases, November 2026 – October 2027.</div><div class="tl2">${PH.map((r,j)=>`<button class="ph ${j==i?'on':''}" data-a="rp" data-i="${j}"><small class="st-${pst(j)}">Phase ${j+1} · ${pst(j)}</small><b>${r[0]}</b><small>${mon(r[1])} – ${mon(r[2])}</small><div class="bar"><i style="width:${ph(j)}%"></i></div><small>${ph(j)}% · ${S.tasks.filter(x=>x.ph==j&&done(x)).length}/${S.tasks.filter(x=>x.ph==j).length}</small></button>`).join('')}</div>
 <div class="card"><div class="row"><div class="sp"><h2 style="font-size:20px;margin:0">Phase ${i+1}: ${p[0]}</h2><small>${p[1]} → ${p[2]} · <span class="st-${st}">${st}</span> · ${ph(i)}% complete</small></div><button class="btn pri" data-a="ed" data-k="tasks" data-i="">+ Task</button><button class="btn" data-a="pmark">Mark complete</button><button class="btn" data-a="ppause">${S.pst[i]=='Paused'?'Resume':'Pause'}</button><button class="btn" data-a="prst">Reset progress</button></div>
 <div class="grid" style="margin-top:8px">${Object.entries(G).map(([k,a])=>`<div class="stat"><small>${esc(k)}</small><b style="font-size:20px">${a.filter(done).length}/${a.length}</b><div class="bar" style="margin-top:8px"><i style="width:${pct(a.filter(done).length,a.length)}%"></i></div></div>`).join('')}</div>
 <label>Phase notes<textarea data-c="pnote" data-i="${i}" placeholder="Objectives, resources, reflections…">${esc(S.pn[i]||'')}</textarea></label></div>
 <div class="card"><div class="row"><input id="q" data-c="q" placeholder="Search this phase…" value="${esc(Q)}" style="flex:1"></div>`+(v.map(x=>`<div class="tr"><select data-c="st" data-i="${x.id}">${ST.map(s=>`<option ${x.st==s?'selected':''}>${s}</option>`).join('')}</select><div class="g1"><b ${done(x)?'style="opacity:.55;text-decoration:line-through"':''}>${esc(x.title)}</b>${x.notes?`<small>${esc(x.notes)}</small>`:''}</div><span class="pill ${x.pri}">${x.pri}</span><small>${x.due}</small><button data-a="mv" data-i="${x.id}" data-d="-1">↑</button><button data-a="mv" data-i="${x.id}" data-d="1">↓</button><button data-a="ed" data-k="tasks" data-i="${x.id}">Edit</button><button data-a="del" data-k="tasks" data-i="${x.id}">✕</button></div>`).join('')||'<div class="empty">No tasks match.</div>')+`</div>`};

let RP=null,T={mode:'Focus',len:25,brk:5,left:1500,run:false,on:false,end:0,link:'',sub:'Java'};
const tot=()=>(T.mode=='Focus'?T.len:T.brk)*60;
function logT(sec){const m=Math.round(sec/60);if(T.mode!='Focus'||m<1)return;const t=S.tasks.find(x=>x.id==T.link);S.sess.push({id:uid(),date:today(),subject:T.sub,min:m,notes:'Focus session'+(t?': '+t.title:'')});if(t&&t.st==ST[0])t.st=ST[1];save()}
function upd(){const a=$('#tm');if(a){a.textContent=fm(T.left);$('#tg').setAttribute('stroke-dasharray',(100-T.left/tot()*100)+' 100')}}
setInterval(()=>{if(!T.run)return;T.left=Math.max(0,Math.round((T.end-Date.now())/1000));upd();if(!T.left){T.run=false;T.on=false;if(T.mode=='Focus'){logT(T.len*60);toast('Focus complete. Take a break.');T.mode='Break'}else{toast('Break over.');T.mode='Focus'}T.left=tot();render()}},500);
R.focus=()=>{const n=S.sess.filter(s=>s.date==today()&&s.notes.startsWith('Focus session')).length,op=S.tasks.filter(x=>!done(x)&&x.ph==cur()).slice(0,60);
 return `<h1>Focus</h1><div class="sub">Pomodoro and custom timers. Completed focus time is logged to your study history automatically.</div><div class="bento"><div class="card tmr c6" style="text-align:center"><div class="row" style="justify-content:center"><button class="btn" data-a="tp" data-f="25" data-b="5">25 / 5</button><button class="btn" data-a="tp" data-f="50" data-b="10">50 / 10</button><input id="cf" type="number" min="1" value="${T.len}" style="width:64px" title="Focus minutes"><input id="cb" type="number" min="1" value="${T.brk}" style="width:64px" title="Break minutes"><button class="btn" data-a="tc">Custom</button></div>
 <div class="tring"><svg viewBox="0 0 100 100" width="100%"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(128,128,128,.25)" stroke-width="5"/><circle id="tg" class="rg" cx="50" cy="50" r="45" fill="none" stroke="var(--ac)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="${100-T.left/tot()*100} 100" transform="rotate(-90 50 50)"/></svg><div class="tt"><div><div id="tm">${fm(T.left)}</div><small>${T.mode}</small></div></div></div>
 <div class="row" style="justify-content:center">${T.run?'<button class="btn pri" data-a="tpause">Pause</button>':`<button class="btn pri" data-a="tstart">${T.on?'Resume':'Start'}</button>`}${T.on?'<button class="btn" data-a="tstop">Stop &amp; log</button>':''}</div></div>
 <div class="card c6"><h2>Session setup</h2><label>Subject<select id="fs">${SUBJ.map(s=>`<option ${T.sub==s?'selected':''}>${s}</option>`).join('')}</select></label><label>Link to roadmap task<select id="fl"><option value="">None</option>${op.map(x=>`<option value="${x.id}" ${T.link==x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label><div class="grid">${stat('Focus sessions today',n)}${stat('Studied today',hrs(mins(today()))+'h')}</div><small>Need to add past time? Use the <a href="#" data-a="go" data-i="study">Study Tracker</a>.</small></div></div>`};
A.tstart=()=>{if(T.run)return;if(T.left<=0)T.left=tot();if($('#fs'))T.sub=$('#fs').value;if($('#fl'))T.link=$('#fl').value;T.end=Date.now()+T.left*1000;T.run=true;T.on=true;render()};
A.tpause=()=>{T.left=Math.max(0,Math.round((T.end-Date.now())/1000));T.run=false;render()};
A.tstop=()=>{const el=tot()-T.left;T.run=false;T.on=false;logT(el);if(T.mode=='Focus'&&el>=60)toast('Session logged');T.mode='Focus';T.left=T.len*60;render()};
A.tp=(i,b)=>{if(T.on)return toast('Stop the current session first');T.len=+b.dataset.f;T.brk=+b.dataset.b;T.mode='Focus';T.left=T.len*60;render()};
A.tc=()=>{if(T.on)return toast('Stop the current session first');const f=+$('#cf').value,b=+$('#cb').value;if(f>0&&b>0){T.len=f;T.brk=b;T.mode='Focus';T.left=f*60;render()}else toast('Enter minutes above 0')};
A.tpom=()=>{A.go('focus');if(!T.on){T.len=25;T.brk=5;T.mode='Focus';T.left=1500}A.tstart()};
A.tsk=i=>{A.go('focus');T.link=i;A.tstart()};
A.rp=i=>{RP=+i;V='roadmap';render();scrollTo(0,0)};
A.qt=nt;A.tog=i=>{const t=S.tasks.find(x=>x.id==i);if(done(t)){t.st=ST[0];delete t.doneAt}else{t.st=ST[2];t.doneAt=today()}save();render()};
A.pmark=()=>{if(confirm('Mark every task in this phase as completed?')){S.tasks.filter(x=>x.ph==(RP??cur())).forEach(x=>{if(!done(x)){x.st=ST[2];x.doneAt=today()}});delete S.pst[RP??cur()];save();render()}};
A.ppause=()=>{const i=RP??cur();if(S.pst[i]=='Paused')delete S.pst[i];else S.pst[i]='Paused';save();render()};
A.col=()=>{S.set.col=!S.set.col;save();render()};
A.acc=i=>{S.set.ac=i;save();render()};
A.bell=()=>{const m=$('#modal'),L=deadlines().filter(x=>x[0]<=wk(-14));m.className='open';m.innerHTML=`<div class="card"><h3>Next 14 days</h3>${L.map(x=>`<div class="tr"><div class="g1">${esc(x[1])}</div><span class="pill">${x[2]}</span><small>${x[0]}</small></div>`).join('')||'<div class="empty">Nothing due in the next two weeks.</div>'}<div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" data-a="close">Close</button></div></div>`};
A.theme=()=>{S.set.theme=S.set.theme=='light'?'dark':'light';save();render()};

function danger(t,d,fn,w='RESET'){const m=$('#modal');m.className='open';m.innerHTML=`<div class="card"><h3>${t}</h3><p>${d}</p><details><summary class="mu" style="cursor:pointer">Export a backup first</summary><textarea readonly id="bkm" style="margin-top:8px;min-height:90px" onfocus="this.select()">${esc(JSON.stringify(S))}</textarea></details><label>Type ${w} to confirm<input id="dzc" autocomplete="off"></label><div class="row"><span class="sp"></span><button class="btn" data-a="close">Cancel</button><button class="btn dz" id="dzo" disabled>Confirm</button></div></div>`;$('#dzc').oninput=e=>{$('#dzo').disabled=e.target.value!=w};$('#dzo').onclick=()=>{if(fn()=='r')return;save();A.close();render();toast('Done')}}
const rs=L=>L.forEach(x=>{x.st=ST[0];delete x.doneAt});
A.dz=k=>{const pid=$('#dzp')&&$('#dzp').value,hi=$('#dzh')&&+$('#dzh').value,p=S.proj.find(x=>x.id==pid);const o={
 sess:['Reset daily study statistics','Deletes every logged study session: hours, streaks, charts and history. Tasks, DSA, projects and applications are untouched.',()=>{S.sess=[]}],
 dsa:['Reset DSA progress','Deletes every logged DSA problem and its statistics.',()=>{S.dsa=[]}],
 proj:['Reset project progress',p?`Resets “${esc(p.name)}”: status, manual progress and its linked roadmap tasks go back to Not Started. The project itself stays.`:'Pick a project first.',()=>{if(!p)return;p.status=ST[0];p.prog=0;rs(S.tasks.filter(x=>p.pre&&x.title.startsWith(p.pre+':')))}],
 phase:['Reset phase progress',`Sets every task in Phase ${hi+1} back to Not Started. Phase names, topics and dates stay.`,()=>{rs(S.tasks.filter(x=>x.ph==hi));delete S.pst[hi]}],
 road:['Reset entire roadmap progress','Sets every task in all six phases back to Not Started and clears paused states. Phase names, descriptions, topics and the Nov 2026 – Oct 2027 dates are preserved. Study history is not touched.',()=>{rs(S.tasks);S.pst={}}],
 all:['Reset ALL application data','This permanently deletes everything you created: tasks and edits, study sessions, DSA problems, projects, applications, checklists and settings, then restores the default roadmap. It cannot be undone.',()=>{localStorage.removeItem(K);location.reload();return 'r'}]}[k];
 if(k=='proj'&&!p)return toast('Pick a project first');danger(o[0],o[1],o[2],k=='all'?'DELETE ALL':'RESET')};
A.reset=()=>A.dz('all');
A.imp=()=>{try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.tasks)||!d.set)throw 0;if(confirm(`Backup preview:\n${d.tasks.length} tasks · ${(d.sess||[]).length} sessions · ${(d.dsa||[]).length} DSA problems · ${(d.proj||[]).length} projects · ${(d.apps||[]).length} applications\n\nReplace ALL current data with this backup?`)){S=d;mig();save();render();toast('Backup restored')}}catch(e){toast('That isn’t a valid DevPath backup')}};
const oldSet=R.settings;
R.settings=()=>oldSet()+`<div class="card"><h2>Appearance</h2><div class="row">${['#4f7cff','#8b5cf6','#10b981','#f59e0b','#f43f5e'].map(c=>`<button class="icb" data-a="acc" data-i="${c}" style="background:${c};${S.set.ac==c?'outline:2px solid var(--tx);outline-offset:2px':''}" title="Accent ${c}"></button>`).join('')}<button class="btn" data-a="col">${S.set.col?'Expand':'Collapse'} sidebar</button><small>Timezone: Asia/Dhaka</small></div></div>

const cpo=()=>{$('#qa').className='';$('#fab').className='';$('#cp').className='open';$('#cpi').value='';cpr();$('#cpi').focus()},cpc=()=>{$('#cp').className=''};
A.cpx=i=>{cpc();CPL[i][2]()};A.cp=cpo;
A.fab=()=>{const o=$('#qa').className!='open';$('#qa').className=o?'open':'';$('#fab').className=o?'o':''};
A.qax=i=>{A.fab();QA[i][2]()};
$('#qal').innerHTML=QA.map((c,i)=>`<button class="ci" data-a="qax" data-i="${i}">${c[0]}<small>${c[1]}</small></button>`).join('');$('#fab').innerHTML=ico('plus',24);
$('#cpi').oninput=cpr;$('#cp').onclick=e=>{if(e.target.id=='cp')cpc()};

 if(k=='escape'){cpc();$('#qa').className='';$('#fab').className=''}
 else if(k=='enter'&&e.target.id=='cpi'&&CPL[0]){cpc();CPL[0][2]()}
 else if(c&&k=='k'){e.preventDefault();cpo()}

 else if(c&&!e.shiftKey&&k=='n'&&!ty){e.preventDefault();nt()}
 else if(c&&e.shiftKey&&k=='s'&&!ty){e.preventDefault();QA[1][2]()}
 else if(c&&e.shiftKey&&k=='p'&&!ty){e.preventDefault();A.tpom()}});

<script>
(()=>{
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const P={sk:'<path d="M12 3l8 6-3 11H7L4 9z"/>',ach:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>',eng:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'};
const ic=(n,z=18)=>`<svg width='${z}' height='${z}' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'>${P[n]}</svg>`;
document.body.insertAdjacentHTML('afterbegin',"<div class='aur'><i></i><i></i><i></i></div><svg width='0' height='0' style='position:absolute'><defs><linearGradient id='gr' x1='0' y1='0' x2='1' y2='1'><stop offset='0' style='stop-color:var(--ac)'/><stop offset='1' style='stop-color:var(--vi)'/></linearGradient></defs></svg>");
const op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const SK={Java:['Core Java','OOP','Collections','Multithreading'],Backend:['Spring Boot','Spring Security','REST API','JPA/Hibernate'],Database:['PostgreSQL','SQL','Database Design','Redis'],DevOps:['Linux','Docker','AWS','CI/CD'],'Problem Solving':['DSA','Algorithms','System Design']},SKS=['Not Started','Learning','Practicing','Confident'];
const g=n=>({cur:0,tgt:4,st:SKS[0],last:'',note:'',...(S.sk||{})[n]});
const rel=n=>{const w=n.toLowerCase().split(/[ \/]/).filter(x=>x.length>2&&!['core','design'].includes(x));return S.tasks.filter(t=>w.some(x=>t.title.toLowerCase().includes(x)))};
function radar(){const ks=Object.keys(SK),N=ks.length,pt=(v,i)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [100+Math.cos(a)*80*v,100+Math.sin(a)*80*v].map(n=>n.toFixed(1))},av=(k,f)=>SK[k].reduce((a,n)=>a+g(n)[f],0)/SK[k].length/5,poly=f=>ks.map((k,i)=>pt(av(k,f),i).join(',')).join(' ');
 return `<svg viewBox='0 0 200 200' width='100%' style='max-width:340px'>${[.25,.5,.75,1].map(r=>`<polygon points='${ks.map((_,i)=>pt(r,i).join(',')).join(' ')}' fill='none' stroke='var(--bd)'/>`).join('')}${ks.map((k,i)=>{const e=pt(1,i),l=pt(1.2,i);return `<line x1='100' y1='100' x2='${e[0]}' y2='${e[1]}' stroke='var(--bd)'/><text x='${l[0]}' y='${l[1]}' text-anchor='middle' font-size='7' fill='var(--mu)'>${k}</text>`}).join('')}<polygon points='${poly('tgt')}' fill='rgba(139,92,246,.12)' stroke='var(--vi)' stroke-dasharray='3 3'/><polygon points='${poly('cur')}' fill='color-mix(in srgb,var(--ac) 30%,transparent)' stroke='var(--ac)' stroke-width='1.5'/></svg>`}
R.skills=()=>`<h1>Skill Matrix</h1><div class='sub'>Rate yourself manually. Levels never change on their own when tasks are completed.</div><div class='bento'><div class='card c4' style='text-align:center'><h2>Overview</h2>${radar()}<small>Solid: current level · dashed: target level (0–5)</small></div><div class='c8' style='display:flex;flex-direction:column;gap:14px'>${Object.entries(SK).map(([k,L])=>`<div class='card'><h2>${k}</h2>${L.map(n=>{const o=g(n),r=rel(n),a=`data-sk='${n}'`;return `<div class='tr' style='flex-wrap:wrap'><div class='g1' style='min-width:150px'><b>${n}</b><small>${r.filter(done).length}/${r.length} related tasks</small></div><label style='margin:0;width:62px'>Now<select ${a} data-f='cur' style='width:100%'>${op([0,1,2,3,4,5],o.cur)}</select></label><label style='margin:0;width:62px'>Goal<select ${a} data-f='tgt' style='width:100%'>${op([1,2,3,4,5],o.tgt)}</select></label><label style='margin:0;width:124px'>Status<select ${a} data-f='st' style='width:100%'>${op(SKS,o.st)}</select></label><label style='margin:0;width:140px'>Last practiced<input type='date' ${a} data-f='last' value='${o.last}'></label><input ${a} data-f='note' placeholder='Notes' value='${esc(o.note)}' style='flex:1;min-width:140px'></div><div class='bar' style='margin-bottom:6px'><i style='width:${pct(o.cur,o.tgt)}%'></i></div>`}).join('')}</div>`).join('')}</div></div>`;
document.addEventListener('change',e=>{const t=e.target,n=t.dataset.sk;if(!n)return;S.sk=S.sk||{};const o=S.sk[n]=S.sk[n]||{};o[t.dataset.f]=['cur','tgt'].includes(t.dataset.f)?+t.value:t.value;save();render()});

R.ach=()=>{const sv=S.dsa.filter(x=>x.status=='Solved').length,L=longest(),ss=S.sess.length,hr=sum(()=>1)/60;
 const AC=[['First Study Session',ss>=1,ss+'/1',50],['7-Day Streak',L>=7,L+'/7',150],['30-Day Streak',L>=30,L+'/30',500],['25 DSA Problems',sv>=25,sv+'/25',150],['50 DSA Problems',sv>=50,sv+'/50',300],['First Completed Project',S.proj.some(p=>p.status==ST[2]),'Mark a project Completed',400],['First Deployment',S.proj.some(p=>/^https?:/.test(p.live||'')),'Add a live URL',300],['First Internship Application',S.apps.some(a=>a.type=='Internship'&&a.status!='Interested'),'Apply to one',100],['First Interview',S.apps.some(a=>['Interview','Offer'].includes(a.status)||a.interview),'Get an interview',200]];
 const xp=AC.filter(a=>a[1]).reduce((s,a)=>s+a[3],0)+Math.floor(hr)*10+sv*5+S.tasks.filter(done).length*3,lv=Math.floor(Math.sqrt(xp/60))+1,lo=(lv-1)**2*60,hi=lv**2*60,wk7=sum(s=>s.date>wk(7)),goal=S.set.target*5,mo=S.tasks.filter(x=>x.doneAt&&x.doneAt.startsWith(today().slice(0,7))).length;
 return `<h1>Achievements</h1><div class='sub'>Optional and separate from the rest of the app. XP: 10 per study hour, 5 per DSA problem, 3 per completed task, plus badges.</div><div class='bento'><div class='card c4'><small>Level</small><div class='big' style='margin:6px 0'>${lv}</div><div class='bar'><i style='width:${pct(xp-lo,hi-lo)}%'></i></div><small>${xp} XP · ${hi-xp} to level ${lv+1}</small></div><div class='card c4'><small>Weekly goal (5 study days)</small><div class='big' style='margin:6px 0'>${pct(wk7,goal)}%</div><div class='bar'><i style='width:${Math.min(100,pct(wk7,goal))}%'></i></div><small>${hrs(wk7)}h of ${hrs(goal)}h</small></div><div class='card c4'><small>Monthly milestone</small><div class='big' style='margin:6px 0'>${mo}</div><small>tasks completed this month</small></div></div><div class='grid'>${AC.map(a=>`<div class='card bd ${a[1]?'on':''}'><div class='ic'>${ic('ach',26)}</div><b>${a[0]}</b><small>${a[1]?'Unlocked · +'+a[3]+' XP':a[2]}</small></div>`).join('')}</div>`};

const EC=['Speaking','Listening','Reading','Writing','Technical Communication'],EN=()=>S.eng||(S.eng=[]);
R.eng=()=>{const t=today(),w=EN().filter(x=>x.date>wk(7)),m=EN().filter(x=>x.date.startsWith(t.slice(0,7))),tm=a=>a.reduce((s,x)=>s+x.min,0);
 return `<h1>English practice</h1><div class='sub'>Weekly goal: 150 minutes across all categories.</div><div class='grid'>${stat('This week',tm(w)+' min',pct(tm(w),150)+'% of goal')}${stat('This month',tm(m)+' min')}${stat('Days practiced (7d)',new Set(w.map(x=>x.date)).size+'/7')}${stat('Sessions',EN().length)}</div>
 <form class='card' id='eg'><h2>Log practice</h2><div class='grid'><label>Date<input type='date' name='date' value='${t}' required></label><label>Category<select name='cat'>${op(EC)}</select></label><label>Minutes<input type='number' name='min' min='1' max='600' value='20' required></label></div><label>Notes<textarea name='notes' placeholder='What did you practice? New words, mistakes…'></textarea></label><button class='btn pri'>Save practice</button></form>
 <div class='grid g2'><div class='card'><h2>This week by category</h2>${hb(EC.map(c=>[c,tm(w.filter(x=>x.cat==c))]).filter(x=>x[1]),'m')}</div><div class='card'><h2>Last 7 days (min)</h2>${vb(lastN(7).map(d=>{const v=tm(EN().filter(x=>x.date==d));return [d.slice(8),v,d+': '+v+' min']}))}</div></div>
 <div class='card'><h2>History</h2>${[...EN()].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40).map(x=>`<div class='tr'><small>${x.date}</small><span class='pill'>${x.cat}</span><b>${x.min}m</b><div class='g1'><small>${esc(x.notes)}</small></div><button data-a='del' data-k='eng' data-i='${x.id}'>✕</button></div>`).join('')||"<div class='empty'>No practice logged yet.</div>"}</div>`};
document.addEventListener('submit',e=>{if(e.target.id!='eg')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));EN().push({id:uid(),date:d.date,cat:d.cat,min:+d.min,notes:d.notes});save();render();toast('Practice saved')});

function burst(x,y){if(RM)return;for(let i=0;i<28;i++){const e=document.createElement('i'),a=Math.random()*6.28,d=60+Math.random()*120;e.className='cf';e.style.cssText=`left:${x}px;top:${y}px;background:hsl(${Math.random()*360|0} 90% 62%);--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px;--r:${Math.random()*720|0}deg`;document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}}
const tg=A.tog;A.tog=(i,b)=>{const was=done(S.tasks.find(x=>x.id==i)),r=b.getBoundingClientRect();tg(i,b);if(!was)burst(r.left+9,r.top+9)};
function cu(el,d=0){if(RM)return;const n=[...el.childNodes].find(x=>x.nodeType==3&&/^\d/.test(x.textContent));if(!n)return;const m=n.textContent.match(/^(\d+(?:\.\d+)?)([\s\S]*)$/);if(!m)return;const to=parseFloat(m[1]),dc=(m[1].split('.')[1]||'').length,sx=m[2];if(!to)return;n.textContent=(0).toFixed(dc)+sx;setTimeout(()=>{const s=performance.now(),f=t=>{const p=Math.min(1,(t-s)/800),e=1-Math.pow(1-p,3);n.textContent=(to*e).toFixed(dc)+sx;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)},d)}
